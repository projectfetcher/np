# managed-by: add_keepalive_workflows.py
name: keepalive
on:
  schedule:
    - cron: '0 3 1 * *'   # once a month, 03:00 UTC on the 1st
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive marker
        run: |
          mkdir -p .github
          date -u > .github/.keepalive
      - name: Commit if changed
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/.keepalive
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "keepalive: prevent scheduled workflow auto-disable"
          git push
